databaseChangeLog:
  - changeSet:
      id: 001-create-repository-table
      author: your-name
      changes:
        - createTable:
            tableName: repository
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: clone_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: stars
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false